name: benchmark a new engine release

# Fires a run when opteryx-core publishes a version this suite has never
# measured. The driving lives HERE rather than in opteryx-core: a release only
# matters to the benchmark once the wheel is actually installable from PyPI,
# which is the thing the suite installs and measures, and that is observable
# from this side without a cross-repo credential.
#
# It decides ONLY whether to launch. Everything after that — waiting for the
# bundle, publishing to opteryx.benchmarks.*, committing the site, deploying
# Pages — is weekly.yml's collect job, dispatched at the end and reused
# verbatim rather than duplicated here.
#
# The Sunday run is untouched: EventBridge Scheduler starts it at 02:00 and
# weekly.yml's own cron collects it at 05:00.

on:
  schedule:
    # DAILY, not hourly. Hourly was wrong twice over: opteryx-core ships 4-5
    # times a week, so most polls had nothing to do, and with no in-flight
    # guard a wedged run re-launched every single hour (2026-08-19: 8 failed
    # launches on VcpuLimitExceeded, then a real second instance the moment
    # capacity freed). Daily matches the release rate, and a run is now bounded
    # at an hour by the kill-switch, so a bad one cannot outlive its own cycle.
    - cron: "17 6 * * *" # 06:17 UTC — clear of the Sunday 02:00 launch/05:00 collect
  workflow_dispatch:

permissions:
  contents: read # to read the versions already benchmarked
  id-token: write # OIDC to AWS
  actions: write # to dispatch weekly.yml

# Never two watchers at once: a slow launch must not race the next hour's poll
# into launching the same version twice.
concurrency:
  group: release-watch
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_BENCH_ROLE_ARN: arn:aws:iam::045121776141:role/opteryx-bench-actions

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Is PyPI's latest opteryx-core already benchmarked?
        # The set of versions already measured is site/data/index.json, which
        # this repo already publishes — so there is no extra state store to
        # keep in sync, and a version is considered done only once its results
        # are actually on the site. A run that failed to publish therefore
        # retries on the next poll rather than being silently skipped.
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://pypi.org/pypi/opteryx-core/json | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "PyPI latest: ${latest}"

          if [ -f site/data/index.json ]; then
            done_versions=$(python3 -c \
              'import json; print(" ".join(sorted({r["engine_version"] for r in json.load(open("site/data/index.json"))})))')
          else
            done_versions=""
          fi
          echo "already benchmarked: ${done_versions:-<none>}"

          for v in ${done_versions}; do
            if [ "$v" = "${latest}" ]; then
              echo "${latest} is already on the site — nothing to do"
              echo "launch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "${latest} has never been benchmarked — launching"
          echo "launch=true" >> "$GITHUB_OUTPUT"
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.launch == 'true'
        with:
          role-to-assume: ${{ env.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: inflight
        name: Refuse to launch while a run is already going
        if: steps.check.outputs.launch == 'true'
        # The site tells us what has FINISHED, never what is running now. A run
        # that wedges never publishes, so a site-only check re-launches it every
        # single poll: on 2026-08-19 that produced 8 failed launches overnight
        # against the 32-vCPU limit, then a real second instance the moment
        # terminating the wedged one freed capacity. The account cannot fit two
        # c8g.4xlarge runs anyway, so the only safe answer is to wait.
        run: |
          set -euo pipefail
          live=$(aws ec2 describe-instances \
            --filters "Name=tag:project,Values=wrenchy-bench" \
                      "Name=instance-state-name,Values=pending,running,shutting-down" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "${live}" ]; then
            echo "::warning::a run is already in flight (${live}) — not launching another"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: launch
        name: Start the run
        if: steps.check.outputs.launch == 'true' && steps.inflight.outputs.proceed == 'true'
        # Invoking the launcher is the ONLY mutation this workflow makes. The
        # Lambda still owns the AMI, instance type, user-data, tags and the
        # kill-switch, so this can ask for a run and cannot ask for an
        # arbitrary instance.
        #
        # PIN the version that was actually detected, rather than asking for
        # "latest" and hoping it still means the same thing. The check step and
        # the install can be minutes apart, and opteryx-core ships often enough
        # that a release landing in that gap would silently redirect the run to
        # a different version than the one this workflow decided to measure.
        run: |
          set -euo pipefail
          aws lambda invoke --function-name opteryx-bench-launcher \
            --payload "{\"engine_version\": \"${{ steps.check.outputs.version }}\"}" \
            --cli-binary-format raw-in-base64-out /tmp/launch.json >/dev/null
          cat /tmp/launch.json
          run_id=$(python3 -c 'import json; print(json.load(open("/tmp/launch.json"))["run_id"])')
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Hand off to the collector
        if: steps.check.outputs.launch == 'true' && steps.inflight.outputs.proceed == 'true'
        # weekly.yml waits for STATUS, publishes and deploys. Dispatching it is
        # not subject to the anti-recursion rule that blocks push-triggers from
        # a GITHUB_TOKEN commit — workflow_dispatch is a different API path,
        # which is the same reason the site deploy step in weekly.yml works.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly.yml --ref main \
            -f run_id='${{ steps.launch.outputs.run_id }}'
          echo "collector dispatched for ${{ steps.launch.outputs.run_id }}"
