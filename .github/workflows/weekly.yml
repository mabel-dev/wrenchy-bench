name: collect benchmark results

# The COLLECTOR. Launching happens in AWS (EventBridge Scheduler -> Lambda), so
# nothing here can start an EC2 instance — this workflow's AWS role is read-only
# on the results bucket plus the platform credential.
#
# Runs three hours after the 02:00 UTC launch, by which time a healthy run is
# usually finished, and waits for the rest. If it is cancelled or fails, the
# instance still completes and still writes its bundle: re-run this workflow and
# the results are picked up, with no second four-hour run.

on:
  schedule:
    - cron: "0 5 * * 0" # Sundays 05:00 UTC, three hours after the launch
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id to collect; defaults to the newest bundle in S3"
        required: false

permissions:
  contents: write
  id-token: write # OIDC to AWS, read-only
  issues: write
  actions: write # to dispatch pages.yml explicitly — see the deploy step below

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Not a secret. A role ARN is an identifier, not a credential — the OIDC
  # trust policy is what restricts it, and that is scoped to
  # `repo:mabel-dev/wrenchy-bench:*`. Keeping it in the workflow means one
  # fewer thing to configure by hand and one fewer thing to get wrong.
  AWS_BENCH_ROLE_ARN: arn:aws:iam::045121776141:role/opteryx-bench-actions
  OPTERYX_PAT_SECRET: ichnos/opteryx-pat
  OPTERYX_CLIENT_ID: xb500
  CORPUS_PREFIX: s3://opteryx-bench-corpora/v2026-08
  RESULTS_BUCKET: s3://opteryx-bench-results

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: find
        name: Find the run to collect
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: bash infra/find-run.sh

      - name: Wait for the run bundle
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: bash infra/wait-for-run.sh

      - name: Download the bundle
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: aws s3 sync "${RESULTS_BUCKET}/runs/${{ steps.find.outputs.run_id }}/" bundle/

      - id: report
        name: Compare against history and build the site data
        continue-on-error: true # findings set a non-zero exit; that is data, not a broken job
        run: python harness/report.py --bundle bundle --site-data site/data

      - name: Publish to opteryx.telemetry
        # Runs after the site data is written and never gates it. The suite
        # must not depend on the thing it measures: a platform outage costs a
        # table commit, not a week of history.
        continue-on-error: true
        run: |
          pip install --quiet rugo
          # The PAT is the client_secret. Read from Secrets Manager, masked
          # before it can reach a log line, and never written to disk.
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$OPTERYX_PAT_SECRET" --query SecretString --output text)
          echo "::add-mask::$SECRET"
          OPTERYX_CREDENTIALS="$SECRET" python harness/publish.py --bundle bundle

      - name: Commit the run to the site
        run: |
          git config user.name  "opteryx-bench"
          git config user.email "bench@opteryx.app"
          git add site/data
          git diff --quiet --cached || git commit -m "bench: ${{ steps.find.outputs.run_id }}"
          git push

      - name: Deploy the results site
        # A push made with the default GITHUB_TOKEN does NOT trigger other
        # workflows' `push` triggers — GitHub's own anti-recursion rule, to
        # stop a workflow's commit from spawning an infinite chain of runs.
        # pages.yml's push-trigger (paths: site/**) therefore never fired from
        # the commit above: confirmed live — it had run exactly once, from
        # the first manual push last night, and never again despite every
        # later site/data commit landing correctly on main. Dispatching it
        # explicitly sidesteps the restriction entirely, since workflow_dispatch
        # is a different API path from the push-event auto-trigger and is not
        # subject to the same rule. Harmless to run even when the commit above
        # was a no-op (nothing changed) — it just redeploys identical content.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Raise an issue on a hard failure
        if: steps.report.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Benchmark regression · ${{ steps.find.outputs.run_id }}" \
            --body-file bundle/REPORT.md \
            --label benchmark

      - name: Terminate the instance and disarm the kill-switch
        # The instance self-terminates and carries its own 7h watchdog; this is
        # the backstop for the case where it died before reaching either. The
        # 8h CloudWatch kill-switch armed at launch stays as the last resort for
        # when this job itself does not run, so it is only removed here.
        if: always()
        run: |
          ID="${{ needs.launch.outputs.instance_id }}"
          aws ec2 terminate-instances --instance-ids "$ID" >/dev/null 2>&1 || true
          aws cloudwatch delete-alarms \
            --alarm-names "opteryx-bench-killswitch-$ID" 2>/dev/null || true
