<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrenchy Bench - Opteryx Benchmarking</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:#F8FAFC; --surface:#FFF; --tint:#F1F7F6;
    --ink:#1C2656; --ink-soft:#475467; --muted:#667085;
    --rule:#E4E8EE; --rule-firm:#CDD4DE; --frame:#4A5590;
    --accent:#177E78; --signal:#B7791F; --alarm:#B42318; --ok:#177E78; --record:#C85412;
    --link:#D2601A;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Space Grotesk", var(--sans);
    --shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 1px 3px rgb(16 24 40 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0E1320; --surface:#151B2B; --tint:#17252A;
      --ink:#E3E8F5; --ink-soft:#B4BDCF; --muted:#8B95AA;
      --rule:#252E42; --rule-firm:#34405A; --frame:#7D88C4;
      --accent:#4CC2B8; --signal:#E0A94F; --alarm:#F07A6E; --ok:#4CC2B8; --record:#F08A4B;
      --link:#F08A4B;
      --shadow: none;
    }
  }
  * { box-sizing:border-box; }
  body {
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    margin:0; padding:0 24px 80px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1160px; margin:0 auto; }
  header { padding:56px 0 30px; }
  .brand { display:flex; align-items:center; gap:14px; margin:0 0 10px; }
  .brand img { width:40px; height:40px; border-radius:8px; flex:none; }
  h1 { font-family:var(--display); font-size:clamp(26px,4vw,34px); font-weight:500;
       letter-spacing:-0.01em; margin:0; color:var(--ink); }
  .sub { color:var(--ink-soft); margin:0; max-width:62ch; }
  .sub a { color:var(--link); }
  h2 { font-family:var(--sans); font-size:12px; font-weight:500; letter-spacing:0.06em;
       text-transform:uppercase; color:var(--ink-soft); margin:52px 0 12px; }

  .headline { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
              border-top:1px solid var(--frame); border-bottom:1px solid var(--rule); margin:0; }
  .headline div { padding:22px 20px 24px; border-left:1px solid var(--rule); }
  .headline div:first-child { border-left:0; padding-left:0; }
  .headline dt { font-family:var(--sans); font-size:11px; font-weight:500; letter-spacing:0.06em;
                 text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; }
  .headline dd { font-family:var(--mono); font-size:15px; margin:0; color:var(--ink);
                 font-variant-numeric:tabular-nums; }

  .scroller { overflow-x:auto; border:1px solid var(--rule); border-radius:12px;
              background:var(--surface); box-shadow:var(--shadow); margin:0; }
  table { border-collapse:collapse; width:100%; font-family:var(--mono); font-size:14px; }
  th { text-align:left; font-family:var(--sans); font-size:11px; font-weight:500; letter-spacing:0.06em;
       text-transform:uppercase; color:var(--ink-soft); background:var(--tint);
       padding:14px 18px; border-bottom:1px solid var(--rule); white-space:nowrap; }
  th:not(:first-child) { text-align:right; }
  td { padding:12px 18px; border-bottom:1px solid var(--rule); color:var(--ink-soft); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; }
  td.k { color:var(--ink); font-weight:500; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }

  .chip { display:inline-block; font-family:var(--sans); font-size:10.5px; font-weight:500;
          letter-spacing:0.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
  .ok      { background:color-mix(in srgb, var(--ok) 12%, transparent);      color:var(--ok); }
  .suspect { background:color-mix(in srgb, var(--signal) 16%, transparent);  color:var(--signal); }
  .failed  { background:color-mix(in srgb, var(--alarm) 12%, transparent);   color:var(--alarm); }

  /* A run that set a new all-time best or worst. Colour alone is not a channel
     everyone can read, so the cell also carries a tooltip naming the record it
     broke and the mark it beat. */
  .muted { color:var(--muted); }
  .this  { color:var(--accent); }
  .best  { color:var(--accent); font-weight:600; }
  .worst { color:var(--alarm);  font-weight:600; }
  .spark { display:inline-block; vertical-align:middle; }
  .chart { display:block; width:100%; height:auto; padding:18px 18px 0; }
  .axis-label { font-family:var(--mono); font-size:11px; fill:var(--muted); }
  .grid { stroke:var(--rule); stroke-width:1; }
  .hit { fill:transparent; }
  [data-tip] { cursor:crosshair; }
  .avg { stroke:var(--muted); stroke-width:1.25; stroke-dasharray:4 3; fill:none; opacity:0.7; }
  .legend { font-family:var(--sans); font-size:12px; color:var(--ink-soft);
            display:flex; gap:22px; padding:6px 18px 16px; flex-wrap:wrap; justify-content:center; }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .legend i { display:inline-block; width:18px; height:0; border-top:2px solid var(--accent); }
  .legend i.dash { border-top:2px dashed var(--muted); }
  .legend i.dot { width:8px; height:8px; border:0; border-radius:50%; background:var(--record); }
  /* The tooltip is fixed-positioned and pointer-events:none so it can never sit
     between the cursor and the next hit target it is describing. */
  #tip { position:fixed; z-index:10; pointer-events:none; opacity:0; transition:opacity .08s;
         background:var(--surface); color:var(--ink); border:1px solid var(--rule-firm); border-radius:8px;
         font-family:var(--mono); font-size:11.5px; line-height:1.5; padding:7px 10px;
         box-shadow:0 4px 14px rgb(16 24 40 / 0.12); white-space:nowrap;
         font-variant-numeric:tabular-nums; }
  #tip.on { opacity:1; }
  #tip b { font-weight:600; }
  #tip em { font-style:normal; color:var(--muted); }
  .empty { font-family:var(--mono); font-size:13px; color:var(--muted); padding:36px 0; }
  footer { margin-top:56px; padding-top:18px; border-top:1px solid var(--rule);
           font-family:var(--sans); font-size:12px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  @media (max-width:600px) {
    body { padding:0 16px 60px; }
    .headline div, .headline div:first-child { border-left:0; padding-left:0; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand"><img src="favicon.svg" alt=""><h1>Wrenchy Bench</h1></div>
  <p class="sub">Tracking the performance of <a href="https://opteryx.app">Opteryx</a> release-over-release.</p>
</header>

<div id="app"><p class="empty">Loading…</p></div>
<div id="tip" role="tooltip"></div>

<footer>
  <a href="https://github.com/mabel-dev/wrenchy-bench">The Source, With Love</a> ·
  <a href="https://github.com/mabel-dev/opteryx-core">Opteryx is on Github</a>
</footer>

</div>

<script>
const fmt = {
  secs: ms => ms == null ? "—" : (ms / 1000).toFixed(2) + "s",
  gb:   b  => b  == null ? "—" : (b / 1e9).toFixed(1) + " GB",
};

// Status strings double as CSS classes (ok/suspect/failed/crashed), so the
// class stays keyed on the raw value; only the label shown to the reader
// changes.
const statusLabel = status => status === "ok" ? "okay" : status;

// "tpch_sf100_skene" -> "TPC-H SF100 (skene)". The last segment is the
// storage format; the rest names the benchmark. Suite names that are acronyms
// get their proper casing, anything unknown is simply capitalised.
const SUITE_NAMES = { clickbench: "Clickbench", h2o: "H2O", job: "JOB", tpch: "TPC-H" };
const lineName = id => {
  const parts = id.split("_");
  const format = parts.length > 1 ? parts.pop() : null;
  const name = parts.map(p => SUITE_NAMES[p] ?? (/^sf\d+$/.test(p) ? p.toUpperCase()
    : p.charAt(0).toUpperCase() + p.slice(1))).join(" ");
  return format ? `${name} (${format})` : name;
};

// Escaped so a run id or version string can never break out of the attribute
// it is stored in.
const esc = str => String(str).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Tooltip payload: title line, value line, then a muted line. Carried on the
// element as an attribute rather than in a JS lookup table so the markup stays
// the single source of truth — the handler below is generic.
const tip = (title, value, note) => `data-tip="${esc([title, value, note].join("|"))}"`;

// Invisible full-height hit targets, one per point, each spanning from the
// midpoint to its left neighbour to the midpoint to its right (and out to the
// edge at either end). They tile the plot exactly rather than being given a
// fixed width: overlapping bands would silently hand a hover to the wrong run
// once runs are packed close together, which is precisely when the reader
// needs the tooltip to tell them which run they are on.
function hits(values, meta, x, x0, x1, h, label, note) {
  const mid = (a, b) => (x(a) + x(b)) / 2;
  return values.map((v, i) => {
    const m = meta?.[i];
    if (v == null || !m) return "";
    const left  = i === 0 ? x0 : mid(i - 1, i);
    const right = i === values.length - 1 ? x1 : mid(i, i + 1);
    return `<rect class="hit" x="${left.toFixed(1)}" y="0"
      width="${Math.max(right - left, 1).toFixed(1)}" height="${h}"
      ${tip(m.run_id, label(v), note ? note(i, m) : m.engine)}/>`;
  }).join("");
}

// A single-path sparkline. Deliberately hand-drawn rather than pulled from a
// chart library: the page has to work offline from a static file, and one
// polyline is not worth a dependency.
function spark(values, meta, w = 108, h = 26) {
  const clean = values.filter(v => v != null);
  if (clean.length < 2) return "";
  const lo = Math.min(...clean), hi = Math.max(...clean);
  const span = hi - lo || 1;
  const step = w / (values.length - 1);
  const x = i => i * step;
  const points = values.map((v, i) =>
    v == null ? null : `${x(i).toFixed(1)},${(h - ((v - lo) / span) * (h - 4) - 2).toFixed(1)}`
  ).filter(Boolean).join(" ");
  const last = clean[clean.length - 1];
  const lastX = w, lastY = h - ((last - lo) / span) * (h - 4) - 2;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="1.4"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2" fill="var(--accent)"/>
    ${hits(values, meta, x, 0, w, h, fmt.secs)}
  </svg>`;
}

// Trailing mean over `window` runs. Trailing rather than centred: a centred
// mean would let a run's own value be pulled by runs that came after it, which
// reads as the past changing every time a new run lands. Positions without a
// full window are null so the line simply starts once there is enough history.
function rolling(values, window) {
  return values.map((_, i) => {
    if (i < window - 1) return null;
    const slice = values.slice(i - window + 1, i + 1);
    if (slice.some(v => v == null)) return null;
    return slice.reduce((a, b) => a + b, 0) / window;
  });
}

// A wider trend line for the fastest-run total across every recorded run
// (not just the last five shown in the table below it) — same hand-drawn
// approach as spark(), with the scale's min/max labeled on the y-axis rather
// than pinned to the chart's left/right edges, which would wrongly imply
// "first run" and "last run" rather than "lowest value" and "highest value".
// A trailing rolling mean is drawn over it: run-to-run noise on this suite is
// a few percent, which is enough to hide the direction of travel in the raw
// line.
const AVG_WINDOW = 5;

function suiteChart(history, w = 1100, h = 300) {
  const values = history.map(run =>
    Object.values(run.totals).reduce((sum, t) => sum + (t.sum_min_ms || 0), 0));
  if (values.length < 2) return `<p class="empty">Not enough runs yet.</p>`;
  const means = rolling(values, AVG_WINDOW);
  const meta = history.map(run => ({
    run_id: run.run_id,
    engine: `${run.engine_version}+${run.engine_build}`,
  }));
  // The mean is bounded by the values it averages, so the raw series alone
  // still fixes the scale.
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = (hi - lo) || 1;
  const padL = 64, padR = 14, padT = 10, padB = 12;
  const step = (w - padL - padR) / (values.length - 1);
  const x = i => padL + i * step;
  const y = v => h - padB - ((v - lo) / span) * (h - padT - padB);
  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const avgPoints = means.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    .filter(Boolean).join(" ");
  // Runs that were an all-time best AT THE TIME. Marking every engine version
  // change was the obvious way to tie speed to releases, but 27 of 28 run-to-run
  // transitions in this history change version — a rule at each is a picket
  // fence, not information. The record progression answers the same question
  // ("which releases actually moved this?") and picks out a handful of runs.
  const records = new Set();
  values.reduce((best, v, i) => {
    if (v != null && (best == null || v < best)) { records.add(i); return v; }
    return best;
  }, null);

  const dots = values.map((v, i) => records.has(i)
    ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="var(--record)"/>`
    : `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--accent)"/>`
  ).join("");
  const targets = hits(values, meta, x, padL, w - padR, h, fmt.secs, (i, m) => {
    const parts = [m.engine];
    if (means[i] != null) parts.push(`${AVG_WINDOW}-run avg ${fmt.secs(means[i])}`);
    if (records.has(i)) parts.push("best so far");
    return parts.join(" · ");
  });
  const axisLabel = (v, yPos) => `<text x="${(padL - 8).toFixed(1)}" y="${yPos.toFixed(1)}"
      class="axis-label" text-anchor="end" dominant-baseline="middle">${fmt.secs(v)}</text>`;
  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
         role="img" aria-label="Fastest-run total, entire suite, across all recorded runs">
      ${[hi, (hi + lo) / 2, lo].map(v => `<line class="grid" x1="${padL}" y1="${y(v).toFixed(1)}"
            x2="${w - padR}" y2="${y(v).toFixed(1)}"/>${axisLabel(v, y(v))}`).join("")}
      ${avgPoints ? `<polyline class="avg" points="${avgPoints}"/>` : ""}
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${targets}
    </svg>
    <div class="legend">
      <span><i></i>Per-run total</span>
      <span><i class="dash"></i>${AVG_WINDOW}-run rolling mean</span>
      <span><i class="dot"></i>Best so far</span>
    </div>`;
}

function render(index) {
  const app = document.getElementById("app");
  if (!index.length) {
    app.innerHTML = `<p class="empty">No runs recorded yet.</p>`;
    return;
  }

  // index.json is newest first; trends read oldest to newest.
  const latest = index[0];
  const history = [...index].reverse();
  const runMeta = history.map(run => ({
    run_id: run.run_id,
    engine: `${run.engine_version}+${run.engine_build}`,
  }));
  const lines = Object.keys(latest.totals);

  const headline = `
    <dl class="headline">
      <div><dt>Latest run</dt><dd>${latest.run_id}</dd></div>
      <div><dt>Engine</dt><dd>${latest.engine_version}+${latest.engine_build}</dd></div>
      <div><dt>Runs recorded</dt><dd>${index.length}</dd></div>
      ${machine(latest.host)}
    </dl>`;

  // The box the numbers came from. Absolute timings mean nothing without it,
  // and a change of instance type is a trend break, not an engine change.
  function machine(host) {
    if (!host || !host.instance_type) return "";
    // Graviton families are <class><generation>g…, e.g. c8g; the rest are x86.
    const arch = /^[a-z]\dg/.test(host.instance_type) ? "ARM" : "x86";
    // "AWS Graviton4 (Neoverse-V2)" -> "AWS Graviton4"; the core is in the tip.
    const cpu = (host.cpu_model || host.instance_type).replace(/\s*\(.*\)$/, "");
    const detail = [arch, host.cpu_count != null ? `${host.cpu_count} CPUs` : null]
      .filter(Boolean).join(", ");
    const memory = host.memory_gib != null ? `${host.memory_gib} GiB`
      : host.mem_total_bytes != null ? `${(host.mem_total_bytes / 2 ** 30).toFixed(1)} GiB` : null;
    const tip = [host.instance_type, host.cpu_model, memory && `${memory} memory`]
      .filter(Boolean).join(" · ");
    return `<div><dt>Hardware</dt><dd data-tip="${esc(`Hardware|${tip}`)}">${esc(`${cpu} (${detail})`)}</dd></div>`;
  }

  // The best and worst this benchmark has ever recorded, with the run that set
  // it. Returned as an index into the series rather than a bare value so the
  // cell can name the run — "fastest ever" is only actionable if you can see
  // which build it was.
  function extreme(series, pick) {
    let best = -1;
    series.forEach((v, i) => {
      if (v == null) return;
      if (best < 0 || pick(v, series[best])) best = i;
    });
    return best;
  }

  // When the latest run holds the record, this cell would print the same number
  // as "this run" two columns to its left, which reads as a rendering fault. The
  // record is already announced there in colour, so the cell steps back to a
  // muted marker rather than repeating it.
  const record = (series, i) => {
    if (i < 0) return `<td class="n">—</td>`;
    if (i === series.length - 1 && series.filter(v => v != null).length > 1) {
      return `<td class="n"><span class="this"
        ${tip(runMeta[i].run_id, fmt.secs(series[i]), "Set by this run")}>= this run</span></td>`;
    }
    return `<td class="n"><span ${tip(runMeta[i].run_id, fmt.secs(series[i]), runMeta[i].engine)}>${
      fmt.secs(series[i])}</span></td>`;
  };

  // The "this run" cell calls out a record. Strictly beyond every prior value,
  // so an exact repeat of the standing best is not announced as a new one — a
  // record has to actually be broken. And it needs something to beat: in a
  // history of one, that run is trivially both best and worst, which is not
  // news. Generic over the formatter so the memory column gets the same
  // treatment as the time column, only with its own words for the two ends.
  const thisRun = (series, format = fmt.secs, labels = ["Fastest", "Slowest"]) => {
    const now = series[series.length - 1];
    const prior = series.slice(0, -1).filter(v => v != null);
    const isBest  = now != null && prior.length > 0 && now < Math.min(...prior);
    const isWorst = now != null && prior.length > 0 && now > Math.max(...prior);
    if (!isBest && !isWorst) return `<td class="n">${format(now)}</td>`;
    const beat = isBest ? Math.min(...prior) : Math.max(...prior);
    const note = `${isBest ? labels[0] : labels[1]} of ${series.filter(v => v != null).length} runs`;
    // A record can be won by less than the display precision — "14.9 GB beats
    // 14.9 GB" reads as a bug. When the old mark rounds to the same string, the
    // margin is what is worth saying instead.
    const margin = Math.abs(now / beat - 1) * 100;
    const versus = format(beat) === format(now)
      ? `${format(now)} · by ${margin.toFixed(2)}%`
      : `${format(now)} · beats ${format(beat)}`;
    return `<td class="n"><span class="${isBest ? "best" : "worst"}"
      ${tip(isBest ? "New best" : "New worst", versus, note)}>${format(now)}</span></td>`;
  };

  const rows = lines.map(line => {
    const total = latest.totals[line];
    const series = history.map(run => run.totals[line]?.sum_min_ms ?? null);
    const bestAt = extreme(series, (v, b) => v < b);
    const worstAt = extreme(series, (v, b) => v > b);
    return `<tr>
      <td class="k" title="${esc(line)}">${esc(lineName(line))}</td>
      ${thisRun(series)}
      ${record(series, bestAt)}
      ${record(series, worstAt)}
      <td class="n">${spark(series, runMeta)}</td>
      <td class="n">${total.queries}</td>
      ${thisRun(history.map(run => run.totals[line]?.peak_rss_bytes ?? null),
                fmt.gb, ["Lowest", "Highest"])}
    </tr>`;
  }).join("");

  const runRows = index.slice(0, 5).map(run => {
    const suite = Object.values(run.totals).reduce((sum, t) => sum + (t.sum_min_ms || 0), 0);
    return `<tr>
      <td class="k">${run.run_id}</td>
      <td class="n"><span class="chip ${run.status}">${statusLabel(run.status)}</span></td>
      <td class="n">${run.engine_version}+${run.engine_build}</td>
      <td class="n">${fmt.secs(suite)}</td>
    </tr>`;
  }).join("");

  app.innerHTML = `
    ${headline}
    <h2>Latest run, by benchmark</h2>
    <div class="scroller"><table>
      <thead><tr>
        <th>Benchmark</th><th>This run</th>
        <th>Fastest run</th><th>Slowest run</th><th>trend</th>
        <th>Queries</th><th>peak RSS</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <h2>Entire suite over time</h2>
    <div class="scroller">${suiteChart(history)}</div>
    <h2>Last five runs</h2>
    <div class="scroller"><table>
      <thead><tr><th>Run</th><th>Status</th><th>Engine</th><th>Suite Σ min</th></tr></thead>
      <tbody>${runRows}</tbody>
    </table></div>`;
}

// One delegated handler for every [data-tip] hit target on the page: the
// tooltip follows the cursor rather than anchoring to the target, because the
// chart is drawn with preserveAspectRatio="none" and a target's on-screen box
// is stretched horizontally out of proportion to the point it describes.
(() => {
  const el = document.getElementById("tip");
  const PAD = 14;
  let live = null;

  const place = (ev) => {
    const box = el.getBoundingClientRect();
    let left = ev.clientX + PAD;
    let top = ev.clientY - box.height - PAD;
    if (left + box.width > window.innerWidth - 8) left = ev.clientX - box.width - PAD;
    if (top < 8) top = ev.clientY + PAD;
    el.style.left = `${Math.max(8, left)}px`;
    el.style.top = `${top}px`;
  };

  document.addEventListener("mousemove", (ev) => {
    const target = ev.target.closest?.("[data-tip]");
    if (!target) {
      if (live) { live = null; el.classList.remove("on"); }
      return;
    }
    if (target !== live) {
      live = target;
      const [title, value, note] = target.getAttribute("data-tip").split("|");
      el.innerHTML = `<b>${esc(title)}</b><br>${esc(value)}${note ? `<br><em>${esc(note)}</em>` : ""}`;
      el.classList.add("on");
    }
    place(ev);
  }, { passive: true });

  // Touch and scroll both leave the tooltip stranded over content it no longer
  // describes, so either one dismisses it.
  document.addEventListener("scroll", () => { live = null; el.classList.remove("on"); },
    { passive: true, capture: true });
})();

// cache:"no-store" is NOT optional. GitHub Pages serves this file with
// `cache-control: max-age=600`, so a plain fetch shows a browser copy up to
// ten minutes stale — and on a results page that reads as "my run did not
// publish", which is the one thing this page must never say wrongly. Reported
// 2026-08-19: the site had three runs while the browser kept showing two.
// The query string is belt-and-braces for anything that ignores no-store.
fetch("data/index.json?t=" + Date.now(), { cache: "no-store" })
  .then(response => response.ok ? response.json() : [])
  .then(render)
  .catch(() => {
    document.getElementById("app").innerHTML =
      `<p class="empty">Could not load data/index.json.</p>`;
  });
</script>
</body>
</html>
